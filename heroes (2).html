<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Герои и личности — Битва за Москву</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="heroes-page">
  <script>
    document.getElementById("heroes-page").innerHTML = `
      <div class="page-transition"><span>ЗАЛ СЛАВЫ И ГЕРОЕВ</span></div>
      <header>
        <a href="index.html" class="logo"><span class="logo-badge">85 ЛЕТ</span> ЦИФРОВОЙ МУЗЕЙ ПОБЕДЫ</a>
        <nav>
          <a href="index.html">Главная</a>
          <a href="heroes.html" class="active">Герои и личности</a>
          <a href="maps.html">Карта рубежей</a>
          <a href="arsenal.html">Техника</a>
          <a href="timeline.html">Хронология и архив</a>
        </nav>
      </header>
      <main class="container">
        <h1 class="section-title">Герои Московской битвы</h1>
        <p class="section-subtitle">Нажимайте на фильтры и открывайте личные дела, чтобы увеличить портрет и прочитать полную биографию</p>
        <div class="filter-bar">
          <button class="filter-btn active" onclick="filterHeroes('all', this)">Все личности (6)</button>
          <button class="filter-btn" onclick="filterHeroes('commander', this)">Полководцы</button>
          <button class="filter-btn" onclick="filterHeroes('hero', this)">Герои передовой</button>
          <button class="filter-btn" onclick="filterHeroes('partisan', this)">Партизаны и разведка</button>
        </div>
        <div class="cards-grid" id="heroes-grid"></div>
      </main>
      <div class="modal-overlay" id="hero-modal">
        <div class="modal-box">
          <button class="modal-close" id="modal-close">&times;</button>
          <div class="modal-grid">
            <img id="modal-img" src="" alt="Портрет" class="modal-photo">
            <div>
              <span class="hero-role" id="modal-role"></span>
              <h2 id="modal-name" style="font-family: 'Playfair Display', serif; font-size: 1.65rem; margin-bottom: 12px; color: var(--accent-gold);"></h2>
              <p id="modal-bio" style="color: var(--text-main); line-height: 1.7; font-size: 0.95rem;"></p>
              <div class="modal-quote" id="modal-quote"></div>
            </div>
          </div>
        </div>
      </div>
      <div style="background: #0d0f12; border-top: 1px solid rgba(212,175,55,0.25); padding: 40px 5%; text-align: center; color: #9aa4b2; font-size: 0.85rem;">
        <p>Творческий проект на конкурс <strong style="color:#f0f2f5;">«Страницы народного подвига. Битва за Москву»</strong> (КИПФИН, ПЦК ОГСЭД)</p>
        <p style="margin-top: 8px;">Автор: <strong style="color:#f0f2f5;">Лизунова Екатерина Михайловна, группа 2ОИБАС-1925</strong> • Научный руководитель: <strong style="color:#f0f2f5;">Парфенова Анна Васильевна</strong></p>
      </div>
    `;
    const list = [
      { cat: "commander", img: "zhukov.jpg", role: "Полководец • Западный фронт", name: "Георгий Константинович Жуков", years: "1896 – 1974 • Генерал армии, Маршал Победы", short: "Возглавил оборону Москвы в критический момент октября 1941 года и спланировал декабрьское контрнаступление.", fullRole: "Командующий Западным фронтом • Четырежды Герой Советского Союза", bio: "10 октября 1941 года принял командование Западным фронтом после прорыва немецких танков под Вязьмой. В кратчайшие сроки восстановил управление войсками на Можайской линии обороны, закрыл танкоопасные направления под Волоколамском, Можайском и Малоярославцем. Под его руководством 5–6 декабря 1941 года советские войска перешли в контрнаступление и отбросили группу армий «Центр» на 100–250 км от столицы. Награждён двумя орденами «Победа» и шестью орденами Ленина.", quote: "«Когда меня спрашивают, что больше всего запомнилось из минувшей войны, я всегда отвечаю: битва за Москву.»" },
      { cat: "commander", img: "rokossovsky.jpg", role: "Полководец • 16-я армия", name: "Константин Константинович Рокоссовский", years: "1896 – 1968 • Генерал-лейтенант", short: "Командовал 16-й армией на главном направлении удара немецких танков — вдоль Волоколамского шоссе, у Истры и Крюково.", fullRole: "Командующий 16-й армией • Дважды Герой Советского Союза", bio: "Войска 16-й армии под его командованием (дивизия Панфилова, 1-я гвардейская танковая бригада Катукова, конники Доватора) сдержали главный танковый удар вермахта вдоль Волоколамского шоссе и на рубеже станции Крюково. Рокоссовский мастерски маневрировал скудными резервами, не дав врагу прорваться к Москве с северо-запада. В декабре 1941 года его армия освободила Истру и Волоколамск.", quote: "«Воевать нужно не числом, а умением, беречь каждого солдата и знать характер противника.»" },
      { cat: "commander", img: "panfilov.jpg", role: "Комдив • 316-я стрелковая дивизия", name: "Иван Васильевич Панфилов", years: "1893 – 1941 • Генерал-майор", short: "Создатель легендарной Панфиловской дивизии, разработавший тактику эшелонированной противотанковой обороны.", fullRole: "Командир 316-й (8-й гвардейской) дивизии • Герой Советского Союза (посмертно)", bio: "Сформировал 316-ю стрелковую дивизию в Алма-Ате и Фрунзе. В октябре–ноябре 1941 года на Волоколамском направлении его дивизия на фронте шириной свыше 40 км сдерживала наступление двух танковых и двух пехотных дивизий врага. Панфилов впервые применил подвижные отряды истребителей танков. Погиб 18 ноября 1941 года у деревни Гусенёво от осколка мины.", quote: "«Не торопись умирать — учись воевать! Солдат должен жить, чтобы бить врага.»" },
      { cat: "hero", img: "klochkov.jpg", role: "Герой передовой • Разъезд Дубосеково", name: "Василий Георгиевич Клочков", years: "1911 – 1941 • Политрук роты", short: "Возглавил группу истребителей танков в легендарном бою у разъезда Дубосеково 16 ноября 1941 года.", fullRole: "Политрук 4-й роты 1075-го стрелкового полка • Герой Советского Союза (посмертно)", bio: "16 ноября 1941 года в разгар генерального наступления немцев на Москву группа истребителей танков под руководством политрука Клочкова в течение четырёх часов удерживала рубеж у разъезда Дубосеково. Связками гранат и бутылками с зажигательной смесью бойцы подбили 18 вражеских танков. Будучи тяжело раненным, Клочков бросился со связкой гранат под вражеский танк.", quote: "«Велика Россия, а отступать некуда — позади Москва!»" },
      { cat: "hero", img: "talalikhin.jpg", role: "Авиация ПВО • Ночной таран", name: "Виктор Васильевич Талалихин", years: "1918 – 1941 • Младший лейтенант", short: "Одним из первых в военной авиации совершил ночной воздушный таран в небе над Подмосковьем, защищая столицу.", fullRole: "Зам. командира эскадрильи 177-го истребительного авиаполка ПВО • Герой Советского Союза", bio: "В ночь на 7 августа 1941 года в небе под Подольском на истребителе И-16 вступил в бой с немецким бомбардировщиком Heinkel He-111, летевшим бомбить Москву. Израсходовав весь боезапас, Талалихин направил свой самолёт на хвост вражеской машины и спасся на парашюте. Всего сбил 6 самолётов врага. Погиб в воздушном бою 27 октября 1941 года.", quote: "«Если я погибну, то один, а если враг долетит до Москвы — погибнут десятки мирных жителей.»" },
      { cat: "partisan", img: "zoya.jpg", role: "Разведка и партизаны • Петрищево", name: "Зоя Анатольевна Космодемьянская", years: "1923 – 1941 • Боец диверсионной части", short: "18-летняя московская школьница, ушедшая добровольцем в тыл врага и ставшая символом несгибаемой стойкости.", fullRole: "Боец диверсионной в/ч 9903 • Первая женщина — Герой Советского Союза в годы ВОВ", bio: "В октябре 1941 года добровольно вступила в разведывательно-диверсионную часть штаба Западного фронта. В конце ноября 1941 года выполняла боевое задание в деревне Петрищево (Рузский район). При попытке поджога немецкого узла связи была схвачена фашистами. Несмотря на жесточайшие пытки, не выдала ни товарищей, ни своего настоящего имени. Казнена 29 ноября 1941 года.", quote: "«Мне не страшно умирать, товарищи! Это счастье — умереть за свой народ!»" }
    ];
    const grid = document.getElementById("heroes-grid");
    list.forEach(h => {
      const card = document.createElement("div");
      card.className = "card hero-card";
      card.setAttribute("data-category", h.cat);
      card.innerHTML = `<div><img src="${h.img}" alt="${h.name}" class="card-photo"><span class="hero-role">${h.role}</span><h3>${h.name}</h3><div class="hero-years">${h.years}</div><p>${h.short}</p></div><button class="btn btn-primary open-modal-btn" data-img="${h.img}" data-name="${h.name}" data-role="${h.fullRole}" data-bio="${h.bio}" data-quote="${h.quote}">Развернуть досье и фото →</button>`;
      grid.appendChild(card);
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
